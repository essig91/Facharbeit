    panel.classList.toggle('trend-enabled', !!cfg.trendEnabled);
    panel.querySelector('.trend-toggle-btn').innerHTML = cfg.trendEnabled
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6,14 12,8 18,14"></polyline></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6,10 12,16 18,10"></polyline></svg>';
    panel.querySelector('.trend-toggle-btn').setAttribute('aria-label', cfg.trendEnabled ? 'Trendansicht einklappen' : 'Trendansicht ausklappen');
    panel.classList.toggle('table-collapsed', !!cfg.tableCollapsed);
    panel.querySelector('.table-collapse-btn').innerHTML = cfg.tableCollapsed
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6,10 12,16 18,10"></polyline></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6,14 12,8 18,14"></polyline></svg>';
    panel.querySelector('.table-collapse-btn').setAttribute('aria-label', cfg.tableCollapsed ? 'Tabelle ausklappen' : 'Tabelle einklappen');
    panel.classList.toggle('config-collapsed', !!cfg.configCollapsed);
    panel.querySelector('.config-collapse-btn').innerHTML = cfg.configCollapsed
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6,10 12,16 18,10"></polyline></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6,14 12,8 18,14"></polyline></svg>';
    panel.querySelector('.config-collapse-btn').setAttribute('aria-label', cfg.configCollapsed ? 'Konfiguration ausklappen' : 'Konfiguration einklappen');
    updateLiveUi(panel, cfg);
    if (cfg.liveEnabled) {
      cfg.liveTimer = setInterval(() => loadPanelData(panel, { incremental: true }), cfg.liveMs || 5000);
    }
  }

}

function applyUrlPreset() {
  const params = new URLSearchParams(location.search);
  const conn = params.get('connectionId');
  const lp = params.get('logpointId');
  if (!conn && !lp) return false;

  const panel = panelGrid.querySelector('.archive-panel');
  if (!panel) return false;

  if (conn) {
    const connSel = panel.querySelector('.conn-checklist');
    Array.from(connSel.querySelectorAll('input[type="checkbox"]')).forEach((cb) => { cb.checked = (cb.value === conn); });
    refreshLogpointOptions(panel);
  }
  if (lp) {
    const lpSel = panel.querySelector('.lp-checklist');
    Array.from(lpSel.querySelectorAll('input[type="checkbox"]')).forEach((cb) => { cb.checked = (cb.value === lp); });
  }
  syncPanelStateFromInputs(panel);
  return true;
}

async function loadBaseData() {
  const [connRes, lpRes] = await Promise.all([
    fetch(api('/connections')),
    fetch(api('/logpoints'))
  ]);

  const connJson = await connRes.json();
  const lpJson = await lpRes.json();
  connections = Array.isArray(connJson) ? connJson : [];
  logpoints = Array.isArray(lpJson) ? lpJson : [];
  connNameById = new Map();
  unitByLogpointId = new Map();
  decimalsByLogpointId = new Map();
  for (const c of connections) {
    const key = String(c.id || c.endpoint || '');
    const val = String(c.name || c.endpoint || c.id || key);
    connNameById.set(key, val);
  }
  for (const lp of logpoints) {
    const id = String(lp.id);
    const unit = lp.unit || lp.engineeringUnit || lp.eu || '';
    unitByLogpointId.set(id, String(unit || ''));
    const decRaw = lp.decimals ?? lp.precision ?? lp.formatDecimals;
    const dec = Number(decRaw);
    if (Number.isInteger(dec) && dec >= 0 && dec <= 12) {
      decimalsByLogpointId.set(id, dec);
    }
  }
}

function wireModeButtons() {
  document.querySelectorAll('.mode-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      mode = Number(btn.dataset.mode) || 1;
      document.querySelectorAll('.mode-btn').forEach((b) => b.classList.toggle('active', b === btn));
      renderPanels();
    });
  });
}

loadAllBtn.addEventListener('click', async () => {
  const panels = Array.from(panelGrid.querySelectorAll('.archive-panel'));
  for (const p of panels) {
    await loadPanelData(p, { incremental: false });
  }
});

document.addEventListener('DOMContentLoaded', async () => {
  try {
    await initRoleUi();
    document.body.classList.toggle('embed-trend-mode', EMBED_MODE);
    wireModeButtons();
    await loadBaseData();

    if (EMBED_MODE) {
      mode = 1;
      const embeddedCfg = getEmbedPanelConfigFromUrl();
      if (embeddedCfg) {
        embeddedCfg.trendEnabled = true;
        embeddedCfg.tableCollapsed = true;
        panelConfigs.set(1, embeddedCfg);
      } else {
        const fallback = getPanelConfig(1);
        fallback.trendEnabled = true;
        fallback.tableCollapsed = true;
      }
    }

    renderPanels();

    if (EMBED_MODE) {
      const firstPanel = panelGrid.querySelector('.archive-panel');
      if (firstPanel) {
        setTimeout(() => { loadPanelData(firstPanel, { incremental: false }); }, 250);
      }
      return;
    }

    const autoLoad = applyUrlPreset();
    if (autoLoad) {
      const firstPanel = panelGrid.querySelector('.archive-panel');
      if (firstPanel) setTimeout(() => { loadPanelData(firstPanel); }, 600);
    }
  } catch (e) {
    panelGrid.innerHTML = `<div class="panel">Fehler beim Laden: ${escapeHtml(String(e.message || e))}</div>`;
  }
});
</script>
