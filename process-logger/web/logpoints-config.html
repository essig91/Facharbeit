<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OPC UA - Variablenkonfiguration</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="stylesheet" href="/_shell.css">
  <script src="/_nav-loader.js" defer></script>
  <script src="/_theme-loader.js" defer></script>
  <style>
    :root{
      /* site-wide theme */
      --accent: #2b6fb3;
      --accent-contrast: #ffffff;
      --row-h: 48px;
      --muted: #666;
      --radius: 6px;

      /* column widths */
      --col-displayname-w: 40%;
      --col-nodeid-w: 1%;
    }

    /* NOTE: Do NOT style body with max-width/margin when inside the shell.
       Use .page-wrapper to constrain the inner content so the left navigation
       doesn't cause horizontal overflow. */
    body { font-family: var(--shell-font), Arial, sans-serif; color: #111; }
    .page-wrapper { max-width:1200px; margin:1.2rem auto; padding:1rem; box-sizing:border-box; }

    h1,h2 { margin: .4rem 0; }
    select,input,button { padding:.3rem; }
    table { width:100%; border-collapse:collapse; margin-top:.6rem; table-layout:auto; }
    th,td { border:1px solid #ddd; padding:.4rem; text-align:left; vertical-align:middle; }
    /* header uses accent color */
    th { background: var(--accent); color: var(--accent-contrast); }
    .muted { color:var(--muted); }
    .actions { display:flex; gap:.35rem; align-items:center; } /* buttons inline */
    .small { font-size:0.9rem; padding:.2rem .5rem; }
    #browseModal { position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:9999; }
    #browseBox { background:#fff; width:95%; max-width:1200px; max-height:85%; overflow:auto; border-radius:6px; padding:12px; box-shadow:0 8px 28px rgba(0,0,0,.25); }
    .nowrap { white-space:nowrap; }
    input[type="number"] { width:6rem; }
    td input[type="text"] { width:100%; box-sizing:border-box; }
    .right { text-align:right; }
    .conn-header { margin-top:1rem; padding:.4rem .6rem; background:#f0f4ff; border:1px solid #d8e1ff; border-radius:4px; }
    .conn-meta { font-size:0.9rem; color:#333; }
    .value-cell { font-family:monospace; white-space:nowrap; width:1%; text-align:right; } /* shrink to content */
    .note { font-size:0.9rem; color:#666; margin-top:.4rem; }
    .spinner { color:#666; }
    .muted-small { color:#666; font-size:0.9rem; }
    td { word-break:break-word; }

    /* cols */
    .col-displayname { width: var(--col-displayname-w); min-width:18rem; }
    td input[data-field="displayName"] { max-width: 80ch; min-width:0; width:100%; box-sizing:border-box; }
    .col-nodeid { font-family:monospace; white-space:nowrap; width: var(--col-nodeid-w); }

    /* unified button style */
    .btn {
      display:inline-block;
      height:34px;
      padding:0 10px;
      border-radius:6px;
      border:1px solid var(--accent);
      background:transparent;
      color:var(--accent);
      cursor:pointer;
      vertical-align:middle;
      line-height:34px;
      font-size:0.95rem;
      box-sizing:border-box;
    }
    .btn:hover { background: rgba(43,111,179,0.06); }
    .btn:active { background: rgba(43,111,179,0.12); }
    .btn--primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }

    /* compact icon button */
    .icon-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:36px;
      height:34px;
      padding:0;
      border-radius:6px;
      border:1px solid var(--accent);
      background:transparent;
      color:var(--accent);
      cursor:pointer;
      box-sizing:border-box;
    }
    .icon-btn:hover { background: rgba(43,111,179,0.06); }

    .icon-svg { width:18px; height:18px; display:inline-block; vertical-align:middle; }

    /* modal table monospace */
    #browseResult table td { font-family:monospace; }
    /* form / layout small adjustments */
    .form-inline { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    .form-inline input[type="text"] { min-width: 200px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav id="nav-placeholder" class="side-nav" aria-label="Seitennavigation"></nav>

    <main class="main-area" id="page-root">
      <div class="page-wrapper">
        <h1>Variablen / Datenpunkt‑Konfiguration</h1>

        <section>
          <h2>Verbindungen</h2>
          <div style="display:flex; gap:.5rem; align-items:center;">
            <label>Verbindung (optional)
              <select id="connSelect"></select>
            </label>
            <div style="margin-left:auto;">
              <button id="btnRefreshConns" class="btn">Aktualisieren</button>
              <button id="btnOpenBrowse" class="btn">Browse</button>
              <button id="btnLoadLogpoints" class="btn">Logpoints laden</button>
            </div>
          </div>
          <div class="note">Hinweis: Alle erfassten Datenpunkte werden automatisch geladen und nach Verbindung gruppiert angezeigt.</div>
        </section>

        <section style="margin-top:1rem;">
          <h2>Erfasste Datenpunkte</h2>
          <div style="display:flex; gap:.5rem; align-items:center; margin-bottom:.5rem;">
            <button id="btnRefreshValues" class="btn">Werte aktualisieren</button>
            <div style="flex:1"></div>
            <div id="logpointsMsg" class="muted"></div>
          </div>
          <div id="logpointsContainer">Keine Daten geladen.</div>
        </section>

        <section style="margin-top:1rem;">
          <h2>Manueller Eintrag</h2>
          <div class="form-inline">
            <input id="manualNodeId" placeholder="NodeId (z. B. ns=1;i=1234)" style="flex:2">
            <input id="manualDisplayName" placeholder="Anzeigename" style="flex:1">
            <input id="manualUnit" placeholder="Einheit" style="width:8rem">
            <input id="manualInterval" type="number" placeholder="Erfassungsintervall in ms" style="width:8rem" value="1000">
            <label style="display:inline-flex; align-items:center; gap:.3rem;"><input id="manualIsAlarm" type="checkbox"> Störung</label>
            <label style="margin-left:0.5rem;">Dezimalstellen <input id="manualDecimals" type="number" min="0" max="6" value="2" style="width:4rem"></label>
            <button id="btnAddManual" class="btn">Hinzufügen</button>
          </div>
        </section>

        <div id="globalMsg" class="muted" style="margin-top:.8rem;">Statusmeldungen erscheinen hier.</div>

        <!-- Browse Modal -->
        <div id="browseModal" aria-hidden="true" style="display:none">
          <div id="browseBox">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h3 id="browseTitle">Browse</h3>
              <button id="browseClose" class="btn">Schließen</button>
            </div>

            <div style="display:flex; gap:.5rem; margin:.5rem 0; align-items:center;">
              <label class="nowrap">Max Tiefe <input id="browseMaxDepth" type="number" value="4" style="width:4rem"></label>
              <label class="nowrap">Max Nodes <input id="browseMaxNodes" type="number" value="500" style="width:6rem"></label>
              <button id="browseDo" class="btn">Browse starten</button>

              <div style="flex:1"></div>

              <button id="browseSelectAll" class="btn">Alle</button>
              <button id="browseUnselectAll" class="btn">Keine</button>
              <button id="browseImport" class="btn">Importieren (Ausgewählte)</button>

              <label style="margin-left:1rem;"><input type="checkbox" id="filterVariables" checked> Nur Variablen</label>

              <label style="margin-left:0.5rem;" class="nowrap">Namespace
                <select id="namespaceFilter" style="width:10rem">
                  <option value="">Alle</option>
                  <option value="0">0</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4 - Serverinterface</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                </select>
              </label>

            </div>

            <div id="browseResult" style="font-family:monospace; white-space:pre-wrap;"></div>
          </div>
        </div>

      </div>
    </main>
  </div>

<script>
/* UI: Auto-load + Browse + inline SVGs for action buttons + small layout fixes */
const api = p => '/api/opcua' + p;

const connSelect = document.getElementById('connSelect');
const btnRefreshConns = document.getElementById('btnRefreshConns');
const btnOpenBrowse = document.getElementById('btnOpenBrowse');
const btnLoadLogpoints = document.getElementById('btnLoadLogpoints');
const btnRefreshValues = document.getElementById('btnRefreshValues');
const logpointsContainer = document.getElementById('logpointsContainer');
const logpointsMsg = document.getElementById('logpointsMsg');
const globalMsg = document.getElementById('globalMsg');

const browseModal = document.getElementById('browseModal');
const browseResult = document.getElementById('browseResult');
const browseTitle = document.getElementById('browseTitle');
const browseMaxDepth = document.getElementById('browseMaxDepth');
const browseMaxNodes = document.getElementById('browseMaxNodes');
const browseDo = document.getElementById('browseDo');
const browseClose = document.getElementById('browseClose');
const browseSelectAll = document.getElementById('browseSelectAll');
const browseUnselectAll = document.getElementById('browseUnselectAll');
const browseImport = document.getElementById('browseImport');
const filterVariablesEl = document.getElementById('filterVariables');
const namespaceFilterEl = document.getElementById('namespaceFilter');

let connectionsCache = [];
let allLogpoints = [];
let browseNodes = [];
let currentConn = null;

/* helper */
function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function showGlobal(t){ globalMsg.innerText = t; }

async function fetchWithTimeout(url, opts = {}, timeoutMs = 8000) {
  const controller = new AbortController();
  const id = setTimeout(()=>controller.abort(), timeoutMs);
  try {
    const r = await fetch(url, Object.assign({}, opts, { signal: controller.signal }));
    clearTimeout(id);
    return r;
  } catch (e) {
    clearTimeout(id);
    throw e;
  }
}

/* Format time values (input in ms) to ms/s/min/h */
function formatTimeMs(ms, decimals = 2) {
  if (ms === null || ms === undefined || ms === '') return '';
  const n = Number(ms);
  if (!isFinite(n)) return String(ms);
  const abs = Math.abs(n);
  if (abs >= 3600_000) return (n / 3600_000).toFixed(decimals) + ' h';
  if (abs >= 60_000) return (n / 60_000).toFixed(decimals) + ' min';
  if (abs >= 1000) return (n / 1000).toFixed(decimals) + ' s';
  return n.toFixed(0) + ' ms';
}

function isTimeDataType(dtype) {
  if (!dtype) return false;
  const s = String(dtype).toLowerCase();
  if (s.includes('time')) return true;
  if (s.includes('3006')) return true;
  if (s.includes('duration') || s.includes('datetime') || s.includes('utc')) return true;
  return false;
}

function humanizeDataType(dt) {
  if (!dt) return '';
  const s = String(dt);
  const sl = s.toLowerCase();
  if (sl.includes('3006') || sl.includes('time') || sl.includes('utc') || sl.includes('datetime') || sl.includes('duration')) {
    return 'Time';
  }
  if (sl.includes('float') || sl.includes('double') || /\bi=float\b/i.test(sl) || /\bi=double\b/i.test(sl) || /;?i=(?:7|10|11)\b/.test(sl)) {
    return 'Real';
  }
  const m = s.match(/^[^:]*:(.*)$/);
  if (m && m[1]) return m[1];
  return s;
}

function formatValueByType(value, datatype, decimals) {
  if (value === null || value === undefined) return '(kein Wert)';
  if (isTimeDataType(datatype)) return formatTimeMs(value, decimals !== undefined ? decimals : 2);
  if (typeof value === 'number') return Number(value).toFixed(Math.max(0, Math.min(6, decimals !== undefined ? decimals : 2)));
  if (typeof value === 'object') {
    try { return JSON.stringify(value); } catch (e) { return String(value); }
  }
  return String(value);
}

/* Inline SVG icons (used to replace PNG img tags) */
function svgIcon(type) {
  if (type === 'save') {
    return '<svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm4-11H6V5h10v3z"/></svg>';
  }
  if (type === 'delete') {
    return '<svg class="icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
  }
  return '';
}

/* load connections */
async function loadConnections() {
  try {
    const r = await fetchWithTimeout(api('/connections'), {}, 5000);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const list = await r.json();
    connectionsCache = Array.isArray(list) ? list : [];
    connSelect.innerHTML = '<option value="">-- wählen --</option>';
    connectionsCache.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id || c.endpoint;
      o.textContent = `${c.name || c.endpoint || c.id}`;
      connSelect.appendChild(o);
    });
    showGlobal('Verbindungen geladen');
  } catch (err) {
    connSelect.innerHTML = '<option>Fehler</option>';
    showGlobal('Fehler beim Laden der Verbindungen: ' + err.toString());
    console.error('loadConnections error', err);
  }
}

/* load all logpoints */
async function loadAllLogpoints() {
  try {
    const r = await fetchWithTimeout(api('/logpoints'), {}, 7000);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const list = await r.json();
    allLogpoints = Array.isArray(list) ? list : [];
    return allLogpoints;
  } catch (err) {
    console.error('loadAllLogpoints error', err);
    allLogpoints = [];
    throw err;
  }
}

/* render grouped by connection */
async function renderAllLogpoints() {
  try {
    await loadConnections();
    await loadAllLogpoints();

    if (!allLogpoints.length) {
      logpointsContainer.innerHTML = '<p>Keine erfassten Datenpunkte gefunden.</p>';
      return;
    }

    const map = new Map();
    allLogpoints.forEach(lp => {
      const key = String(lp.connectionId || '').trim();
      const arr = map.get(key) || [];
      arr.push(lp);
      map.set(key, arr);
    });

    const groups = [];
    for (const [key, items] of map.entries()) {
      const connMeta = connectionsCache.find(c => String(c.id) === String(key) || String(c.endpoint) === String(key));
      const label = connMeta ? (connMeta.name || connMeta.endpoint) : (key || '(unbekannte Verbindung)');
      groups.push({ key, label, connMeta, items });
    }
    groups.sort((a,b) => String(a.label).localeCompare(String(b.label), undefined, {sensitivity:'base'}));

    // Build HTML string (safe, escaped)
    let html = '';
    groups.forEach(g => {
      g.items.sort((x,y) => String(x.nodeId).localeCompare(String(y.nodeId), undefined, {sensitivity:'base'}));
      html += `<div class="conn-header"><div class="conn-meta"><strong>${escapeHtml(g.label)}</strong> ${g.connMeta ? '('+escapeHtml(g.connMeta.endpoint)+')' : ''}</div></div>`;
      html += `<table class="lp-table"><thead><tr>
        <th class="col-displayname">Anzeigename</th>
        <th style="white-space:nowrap">Datentyp</th>
        <th style="white-space:nowrap">Einheit</th>
        <th style="white-space:nowrap">Erfassungsintervall</th>
        <th style="white-space:nowrap">Störung</th>
        <th style="white-space:nowrap">Dezimalstellen</th>
        <th style="white-space:nowrap">Aktueller Wert</th>
        <th>Aktionen</th>
        <th class="col-nodeid">NodeId</th>
      </tr></thead><tbody>`;
      g.items.forEach(lp => {
        const dp = Number(lp.decimals === undefined ? 2 : lp.decimals) || 2;
        const humanDt = humanizeDataType(lp.dataType || '');
        // Note: action buttons will be converted to SVG after inserting into DOM
        html += `<tr id="lp-${escapeHtml(lp.id)}" data-nodeid="${escapeHtml(lp.nodeId)}" data-conn="${escapeHtml(lp.connectionId)}" data-datatype="${escapeHtml(lp.dataType || '')}">
          <td class="col-displayname"><input data-lpid="${escapeHtml(lp.id)}" data-field="displayName" value="${escapeHtml(lp.displayName||lp.browseName||'')}" style="width:100%"></td>
          <td class="nowrap">${escapeHtml(humanDt)}</td>
          <td style="white-space:nowrap"><input data-lpid="${escapeHtml(lp.id)}" data-field="unit" value="${escapeHtml(lp.unit||'')}" style="width:6rem"></td>
          <td style="white-space:nowrap"><input data-lpid="${escapeHtml(lp.id)}" data-field="samplingIntervalMs" type="number" value="${escapeHtml(lp.samplingIntervalMs||1000)}" style="width:8rem"></td>
          <td style="text-align:center; white-space:nowrap"><input type="checkbox" data-lpid="${escapeHtml(lp.id)}" data-field="isAlarm" ${lp.isAlarm ? 'checked' : ''}></td>
          <td style="white-space:nowrap"><input data-lpid="${escapeHtml(lp.id)}" data-field="decimals" type="number" min="0" max="6" value="${escapeHtml(dp)}" style="width:4rem"></td>
          <td class="value-cell" data-valuecell="${escapeHtml(lp.id)}">--</td>
          <td class="actions">
            <button data-action="save" data-lpid="${escapeHtml(lp.id)}" data-icon="save" class="icon-btn" title="Speichern" aria-label="Speichern"></button>
            <button data-action="delete" data-lpid="${escapeHtml(lp.id)}" data-icon="delete" class="icon-btn" title="Löschen" aria-label="Löschen"></button>
          </td>
          <td class="col-nodeid">${escapeHtml(lp.nodeId)}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    });

    logpointsContainer.innerHTML = html;

    // Replace data-icon buttons' content with inline SVGs
    logpointsContainer.querySelectorAll('button[data-icon]').forEach(btn => {
      const t = btn.getAttribute('data-icon');
      btn.innerHTML = svgIcon(t) || '';
    });

    // attach handlers: save/delete
    logpointsContainer.querySelectorAll('button[data-action="save"]').forEach(b => b.addEventListener('click', async (ev) => {
      const id = b.getAttribute('data-lpid'); await saveLpFromInputs(id);
    }));
    logpointsContainer.querySelectorAll('button[data-action="delete"]').forEach(b => b.addEventListener('click', async (ev) => {
      const id = b.getAttribute('data-lpid');
      if (!confirm('Löschen?')) return;
      try {
        const r = await fetchWithTimeout(api('/logpoints/' + encodeURIComponent(id)), { method: 'DELETE' }, 8000);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        await renderAllLogpoints();
      } catch (e) { alert('Fehler beim Löschen: ' + e); console.error(e); }
    }));

    // auto refresh values
    await refreshDisplayedValues(true);

  } catch (e) {
    logpointsContainer.innerHTML = 'Fehler beim Laden der Logpoints';
    console.error('renderAllLogpoints error', e);
  }
}

/* read single value via readValue route */
async function readValue(connectionId, nodeId) {
  try {
    const r = await fetchWithTimeout(api('/readValue'), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ connectionId, nodeId })
    }, 8000);
    const j = await r.json();
    if (!r.ok) throw new Error(j && j.error ? j.error : ('HTTP ' + r.status));
    return { ok: true, value: ('value' in j) ? j.value : null };
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}

/* refreshDisplayedValues: concurrency, timeout, retry */
async function refreshDisplayedValues(firstAttempt = false) {
  logpointsMsg.innerText = 'Werte werden aktualisiert…';
  const rows = Array.from(document.querySelectorAll('tr[id^="lp-"]'));
  if (!rows.length) { logpointsMsg.innerText = 'keine Datenpunkte'; return; }

  rows.forEach(r => { const id = r.id.replace('lp-',''); const cell = r.querySelector(`[data-valuecell="${id}"]`); if (cell) { cell.innerText = '…'; cell.title=''; } });

  const concurrency = 6;
  let idx = 0;
  const errors = [];

  async function worker() {
    while (true) {
      const i = idx++;
      if (i >= rows.length) break;
      const row = rows[i];
      const nodeId = row.getAttribute('data-nodeid');
      const connId = row.getAttribute('data-conn');
      const datatype = row.getAttribute('data-datatype') || '';
      const id = row.id.replace('lp-','');
      const valueCell = row.querySelector(`[data-valuecell="${id}"]`);
      if (!nodeId || !connId || !valueCell) continue;

      const res = await readValue(connId, nodeId);
      if (!res.ok) {
        valueCell.innerText = '(Fehler)';
        valueCell.title = res.error || '';
        errors.push({ nodeId, error: res.error });
        continue;
      }
      const v = res.value;
      const decEl = row.querySelector(`input[data-lpid="${id}"][data-field="decimals"]`);
      const decimals = decEl ? (Number(decEl.value) || 0) : 2;
      const formatted = formatValueByType(v, datatype, decimals);
      valueCell.innerText = formatted;
      valueCell.title = (typeof v === 'number' ? v : JSON.stringify(v));
    }
  }

  const workers = [];
  for (let w=0; w<concurrency; w++) workers.push(worker());
  await Promise.all(workers);

  const still = Array.from(document.querySelectorAll('.value-cell')).filter(c => c.innerText === '…');
  if (firstAttempt && still.length) {
    await new Promise(r => setTimeout(r, 700));
    await refreshDisplayedValues(false);
    return;
  }

  logpointsMsg.innerText = errors.length ? `Fertig: ${errors.length} Fehler` : 'Werte aktualisiert';
}

/* Browse rendering */
function openBrowseForSelected() {
  const id = connSelect && connSelect.value;
  if (!id) return showGlobal('Bitte Verbindung wählen');
  const conn = connectionsCache.find(c => String(c.id) === String(id) || String(c.endpoint) === String(id));
  if (!conn) return showGlobal('Connection nicht gefunden');
  currentConn = conn;
  if (browseTitle) browseTitle.textContent = 'Browse: ' + (conn.name || conn.endpoint || conn.id);
  if (browseResult) browseResult.innerText = 'Ready';
  if (browseModal) browseModal.style.display = 'flex';
  browseNodes = [];
}

async function doBrowse() {
  if (!currentConn) return showGlobal('Keine Connection ausgewählt');
  if (browseResult) browseResult.innerText = 'Browsen...';
  const maxDepthVal = Number(browseMaxDepth && browseMaxDepth.value) || 4;
  const maxNodesVal = Number(browseMaxNodes && browseMaxNodes.value) || 500;
  const onlyVariables = !!(filterVariablesEl && filterVariablesEl.checked);
  const includeValue = true;
  let startNode = currentConn.startNodeId || 'ObjectsFolder';
  let namespaceVal = (namespaceFilterEl && namespaceFilterEl.value) ? namespaceFilterEl.value : '';

  try {
    const body = {
      endpoint: currentConn.endpoint,
      username: currentConn.authentication && currentConn.authentication.username,
      password: currentConn.authentication && currentConn.authentication.password,
      securityPolicy: currentConn.securityPolicy || 'None',
      startNodeId: startNode,
      maxDepth: maxDepthVal,
      maxNodes: maxNodesVal,
      includeValue: includeValue
    };
    if (onlyVariables) body.nodeClass = 2;
    if (namespaceVal !== '') body.namespace = Number(namespaceVal);

    const r = await fetchWithTimeout(api('/browse'), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }, 60000);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || JSON.stringify(j));
    browseNodes = j.nodes || [];
    renderBrowseNodes(browseNodes);
    showGlobal(`Browse abgeschlossen: ${browseNodes.length} nodes`);
  } catch (err) {
    if (browseResult) browseResult.innerText = 'Fehler beim Browse: ' + err.toString();
    showGlobal('Browse-Fehler: ' + err.toString());
    console.error('doBrowse error', err);
  }
}

function renderBrowseNodes(nodes) {
  if (!nodes || nodes.length === 0) { if (browseResult) browseResult.innerText = '(keine nodes)'; return; }
  const t = document.createElement('table');
  t.innerHTML = `<thead><tr><th>#</th><th>Auswahl</th><th>NodeId</th><th>Anzeigename</th><th>Datentyp</th><th>Einheit</th><th>Erfassungsintervall in ms</th><th>Störung</th><th>Dezimalstellen</th><th>Wert</th></tr></thead>`;
  const tb = document.createElement('tbody');
  nodes.forEach((n,i) => {
    const valRaw = n.value === undefined || n.value === null ? '' : n.value;
    const dt = n.dataType || '';
    const valDisplay = isTimeDataType(dt) && valRaw !== '' ? formatTimeMs(valRaw, 2) : (valRaw === '' ? '' : String(valRaw));
    const displayNameVal = n.displayName || n.browseName || '';
    const dtText = humanizeDataType(dt);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="width:3rem">${i+1}</td>
      <td style="width:3rem"><input type="checkbox" data-idx="${i}"></td>
      <td style="font-family:monospace">${escapeHtml(n.nodeId)}</td>
      <td><input data-displayname idx="${i}" type="text" value="${escapeHtml(displayNameVal)}"></td>
      <td class="nowrap">${escapeHtml(dtText)}</td>
      <td><input data-unit idx="${i}" type="text"></td>
      <td><input data-interval type="number" idx="${i}" value="1000"></td>
      <td style="text-align:center"><input data-isalarm idx="${i}" type="checkbox"></td>
      <td><input data-decimals type="number" idx="${i}" min="0" max="6" value="2" style="width:4rem"></td>
      <td style="font-family:monospace">${escapeHtml(String(valDisplay))}</td>
    `;
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  if (browseResult) { browseResult.innerHTML = ''; browseResult.appendChild(t); }
}

/* import/save/add */
async function importSelectedFromBrowse() {
  const checks = browseResult.querySelectorAll('input[type=checkbox][data-idx]');
  const selected = [];
  checks.forEach(cb => {
    if (cb.checked) {
      const i = Number(cb.getAttribute('data-idx'));
      const n = browseNodes[i];
      if (!n) return;
      const unit = (browseResult.querySelector(`input[data-unit][idx="${i}"]`) || {}).value || '';
      const interval = Number((browseResult.querySelector(`input[data-interval][idx="${i}"]`) || {}).value) || 1000;
      const isAlarm = !!(browseResult.querySelector(`input[data-isalarm][idx="${i}"]`) || {}).checked;
      const dataType = n.dataType || '';
      const displayNameEl = browseResult.querySelector(`input[data-displayname][idx="${i}"]`);
      const displayName = displayNameEl ? displayNameEl.value : (n.displayName || '');
      const decimalsEl = browseResult.querySelector(`input[data-decimals][idx="${i}"]`);
      const decimals = decimalsEl ? Number(decimalsEl.value)||2 : 2;

      selected.push({
        connectionId: currentConn.id || currentConn.endpoint,
        nodeId: n.nodeId,
        browseName: n.browseName || '',
        displayName: displayName,
        dataType: dataType,
        unit,
        samplingIntervalMs: interval,
        isAlarm,
        decimals
      });
    }
  });
  if (!selected.length) return alert('Keine Nodes ausgewählt');
  if (!confirm(`Importiere ${selected.length} Einträge?`)) return;

  try {
    const r = await fetchWithTimeout(api('/logpoints/bulk'), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(selected)
    }, 15000);

    const text = await r.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch(e) { json = null; }

    if (r.ok && json) {
      showGlobal(`Importiert: ${json.count || selected.length} Einträge`);
      browseModal.style.display='none';
      await renderAllLogpoints();
      return;
    }

    let success = 0;
    const errors = [];
    for (const item of selected) {
      try {
        const r2 = await fetchWithTimeout(api('/logpoints'), {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(item)
        }, 8000);
        const t2 = await r2.text();
        if (r2.ok) success++; else errors.push(t2 || `HTTP ${r2.status}`);
      } catch (e) { errors.push(String(e)); }
    }

    if (errors.length) {
      showGlobal(`Import fertig: ${success} erfolgreich, ${errors.length} Fehler`);
      alert('Import teilweise fehlgeschlagen:\n' + errors.slice(0,5).join('\n'));
    } else {
      showGlobal(`Importiert: ${success} Einträge (Einzel-POST-Fallback)`);
    }
    browseModal.style.display='none';
    await renderAllLogpoints();
  } catch (err) {
    alert('Import-Fehler: ' + (err && err.message ? err.message : String(err)));
    console.error('importSelectedFromBrowse error', err);
  }
}

async function saveLpFromInputs(id) {
  const displayEl = document.querySelector(`input[data-lpid="${id}"][data-field="displayName"]`);
  const unitEl = document.querySelector(`input[data-lpid="${id}"][data-field="unit"]`);
  const intEl = document.querySelector(`input[data-lpid="${id}"][data-field="samplingIntervalMs"]`);
  const alarmEl = document.querySelector(`input[data-lpid="${id}"][data-field="isAlarm"]`);
  const decEl = document.querySelector(`input[data-lpid="${id}"][data-field="decimals"]`);
  const patch = {
    displayName: displayEl ? displayEl.value : '',
    unit: unitEl ? unitEl.value : '',
    samplingIntervalMs: intEl ? Number(intEl.value)||1000 : 1000,
    isAlarm: alarmEl ? !!alarmEl.checked : false,
    decimals: decEl ? Number(decEl.value)||2 : 2
  };
  try {
    const r = await fetchWithTimeout(api('/logpoints/' + encodeURIComponent(id)), { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(patch) }, 8000);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    showGlobal('Gespeichert');
    await renderAllLogpoints();
  } catch (err) {
    alert('Fehler beim Speichern: ' + err.toString());
    console.error('saveLpFromInputs error', err);
  }
}

async function addManualEntry() {
  const id = connSelect && connSelect.value;
  const conn = connectionsCache.find(c => String(c.id) === String(id) || String(c.endpoint) === String(id));
  const connectionId = conn ? (conn.id || conn.endpoint) : id || '';
  const nodeIdEl = document.getElementById('manualNodeId');
  const displayNameEl = document.getElementById('manualDisplayName');
  const unitEl = document.getElementById('manualUnit');
  const intervalEl = document.getElementById('manualInterval');
  const isAlarmEl = document.getElementById('manualIsAlarm');
  const decimalsEl = document.getElementById('manualDecimals');

  const nodeId = nodeIdEl ? nodeIdEl.value.trim() : '';
  const displayName = displayNameEl ? displayNameEl.value.trim() : '';
  const unit = unitEl ? unitEl.value.trim() : '';
  const interval = Number(intervalEl ? intervalEl.value : 1000) || 1000;
  const isAlarm = !!(isAlarmEl && isAlarmEl.checked);
  const decimals = Number(decimalsEl ? decimalsEl.value : 2) || 2;

  if (!nodeId) return alert('NodeId benötigt');
  if (!connectionId) return alert('Bitte Connection wählen oder ConnectionId/Endpoint im Select eintragen');
  try {
    const r = await fetchWithTimeout(api('/logpoints'), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ connectionId: connectionId, nodeId, displayName, unit, samplingIntervalMs: interval, isAlarm, decimals })
    }, 8000);
    if (!r.ok) {
      const txt = await r.text();
      throw new Error(txt || 'HTTP ' + r.status);
    }
    showGlobal('Manueller Eintrag angelegt');
    await renderAllLogpoints();
  } catch (err) {
    alert('Fehler beim Anlegen: ' + err.toString());
    console.error('addManualEntry error', err);
  }
}

/* Events wiring */
btnRefreshConns && btnRefreshConns.addEventListener('click', async () => { await loadConnections(); await renderAllLogpoints(); });
btnOpenBrowse && btnOpenBrowse.addEventListener('click', openBrowseForSelected);
btnLoadLogpoints && btnLoadLogpoints.addEventListener('click', renderAllLogpoints);
btnRefreshValues && btnRefreshValues.addEventListener('click', async () => { await refreshDisplayedValues(); });
browseDo && browseDo.addEventListener('click', doBrowse);
browseClose && browseClose.addEventListener('click', () => { if (browseModal) browseModal.style.display='none'; });
browseSelectAll && browseSelectAll.addEventListener('click', () => { if (browseResult) browseResult.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=true); });
browseUnselectAll && browseUnselectAll.addEventListener('click', () => { if (browseResult) browseResult.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false); });
browseImport && browseImport.addEventListener('click', importSelectedFromBrowse);
document.getElementById('btnAddManual') && document.getElementById('btnAddManual').addEventListener('click', addManualEntry);

/* Prevent concurrent renders and do a single delayed initial load */
let isRendering = false;
async function safeRenderAllLogpoints() {
  if (isRendering) return;
  isRendering = true;
  try {
    await renderAllLogpoints();
  } catch (e) {
    console.error('safeRenderAllLogpoints error', e);
  } finally {
    isRendering = false;
  }
}

/* Initialize after insertion (works standalone and when loaded into the Shell) */
function whenReady(fn) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fn);
  } else {
    setTimeout(fn, 0);
  }
}

whenReady(async () => {
  try {
    await loadConnections();
  } catch (e) {
    console.error('initial loadConnections error', e);
  }
  // single delayed render (600ms)
  const delayMs = 600;
  setTimeout(() => {
    safeRenderAllLogpoints();
  }, delayMs);
});
</script>
