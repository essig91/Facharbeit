<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NTP — Process‑Logger</title>
  <link rel="stylesheet" href="/_shell.css">
  <style>
    :root{ --radius:6px; --muted:#666; --accent:#2b6fb3; }
    main{padding:20px;}
    .card{background:var(--card-bg);border-radius:var(--radius);padding:16px;border:1px solid rgba(0,0,0,0.06);}
    .warn{color:#8a1f11;background:#fff0f0;padding:.5rem;border-radius:4px;margin-bottom:1rem;}
    input[type="text"]{width:100%;padding:.4rem;font-size:1rem;}
    button{padding:.5rem 1rem;margin-top:.5rem;}
    pre{background:#f6f8fa;padding:.8rem;border:1px solid #e1e4e8;white-space:pre-wrap;}
  </style>
</head>
<body>
  <div id="side-nav-placeholder"></div>
  <main>
    <div class="card">
      <h1>NTP konfigurieren</h1>
      <div class="warn">Achtung: Mit "Sofort anwenden" (makestep) wird die Systemzeit sofort geändert — das kann laufende Prozesse beeinflussen.</div>

      <form id="ntpForm">
        <label>
          NTP Server (IP oder Hostname)
          <input type="text" id="server" placeholder="z. B. 192.168.0.10" required value="192.168.0.10">
        </label>

        <label><input type="checkbox" id="applyNow"> Sofort anwenden (makestep)</label>

        <button type="submit">Speichern</button>
      </form>

      <h2>Antwort</h2>
      <pre id="out">Noch keine Aktion.</pre>
    </div>
  </main>

  <script src="/_shell-init.js" defer></script>

  <script>
    const form = document.getElementById('ntpForm');
    const out = document.getElementById('out');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      out.textContent = 'Sende...';
      const server = document.getElementById('server').value.trim();
      const applyNow = document.getElementById('applyNow').checked;
      if (!server) { out.textContent = 'Bitte einen Server angeben.'; return; }
      try {
        const res = await fetch('/api/ntp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ server, applyNow })
        });
        const text = await res.text();
        out.textContent = `HTTP ${res.status}\n\n${text}`;
      } catch (err) {
        out.textContent = 'Fehler beim Aufruf der API:\n' + err.toString();
      }
    });
  </script>
</body>
</html>
