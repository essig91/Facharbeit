# /etc/sudoers.d/process-logger
#
# Allow the process-logger service user to run required system commands
# without an interactive password prompt.
#
# IMPORTANT:
# - Replace processlogger with the real Linux user running the Node service.
# - Validate with: sudo visudo -cf /etc/sudoers.d/process-logger
# - File permissions: 0440

User_Alias PROCESS_LOGGER_USER = logger

Cmnd_Alias PROCESS_LOGGER_TIME = \
  /usr/local/sbin/set-chrony-server.sh *, \
  /usr/bin/chronyc online, \
  /usr/bin/chronyc offline, \
  /usr/bin/chronyc -a makestep, \
  /bin/date -s *, \
  /usr/bin/timedatectl set-timezone *

Cmnd_Alias PROCESS_LOGGER_SYSTEM = \
  /bin/systemctl restart process-logger.service, \
  /bin/systemctl reboot

# Netzwerkbefehle für Node.js Backend:
Cmnd_Alias PROCESS_LOGGER_NETWORK = \
  /usr/sbin/ip *, \
  /usr/bin/nmcli *, \
  /usr/local/bin/apply-network.sh *

PROCESS_LOGGER_USER ALL=(root) NOPASSWD: PROCESS_LOGGER_TIME, PROCESS_LOGGER_SYSTEM, PROCESS_LOGGER_NETWORK
